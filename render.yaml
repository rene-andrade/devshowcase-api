# Blueprint do branch `advanced`: só o web service, sem bloco `databases`.
# Usa o banco devshowcase-db, que já pertence ao Blueprint do main (backup em render.main.yaml).
services:
  - type: web
    name: devshowcase-api-advanced
    runtime: node
    plan: free
    repo: https://github.com/rene-andrade/devshowcase-api
    branch: advanced
    autoDeploy: true
    buildCommand: npm install --include=dev && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
