databases:
  - name: devshowcase-db
    databaseName: devshowcase
    user: devshowcase_user
    plan: free

services:
  - type: web
    name: devshowcase-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString
